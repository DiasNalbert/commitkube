services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Both are required. Without ENCRYPTION_KEY every stored credential --
      # SCM passwords, tokens, deploy keys -- would be written in plain text.
      # Generate it with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY to 64 hex characters (openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # The database and the Trivy cache live on the volume.
      DB_PATH: /app/data/kubecommit.db
    volumes:
      - db_data:/app/data
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  db_data:
