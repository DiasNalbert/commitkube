name: CI

# The tests already existed and nothing ran them, which meant a green local
# run was the only evidence anything worked. This is the cheapest thing that
# turns that into a fact about every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The package init aborts without these, and a test run that dies in
      # init looks identical to a test run with no tests.
      - name: Test
        env:
          JWT_SECRET: ci-only-not-a-real-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: go test ./... -count=1

      # Only the files this project keeps formatted. Several predate the
      # convention and reformatting them wholesale would bury real changes in
      # whitespace, so they are not failed on here.
      - name: Format
        run: |
          unformatted=$(gofmt -l handlers/*.go db/*.go crypto/*.go middleware/*.go main.go \
            | grep -vE 'handlers/(groups|settings|scan|nodes|external_secrets)\.go' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # next build runs the linter too, so this covers both.
      - name: Build
        run: npx next build
